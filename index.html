        // ==========================================
        // STATE & NAVIGATION LOGIC
        // ==========================================
        let currentSlide = 0;

        // Track user answers per slide so switching slides preserves progress
        // Structure: { slideIndex: { questionIndex: selectedOptionString } }
        const userAnswers = {};

        function initPresentation() {
            const selector = document.getElementById('slideSelector');
            const dotsContainer = document.getElementById('dotIndicators');

            slidesData.forEach((slide, idx) => {
                const option = document.createElement('option');
                option.value = idx;
                option.textContent = slide.menuTitle;
                selector.appendChild(option);

                const dot = document.createElement('button');
                dot.type = 'button';
                dot.title = slide.menuTitle;
                dot.onclick = () => goToSlide(idx);
                dot.className = "w-2.5 h-2.5 rounded-full transition-all duration-200 bg-slate-300 hover:bg-green-500";
                dot.id = `dot-${idx}`;
                dotsContainer.appendChild(dot);
            });

            renderSlide();
        }

        function goToSlide(index) {
            if (index >= 0 && index < slidesData.length) {
                currentSlide = index;
                renderSlide();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function nextSlide() {
            if (currentSlide < slidesData.length - 1) {
                goToSlide(currentSlide + 1);
            }
        }

        function prevSlide() {
            if (currentSlide > 0) {
                goToSlide(currentSlide - 1);
            }
        }

        // Keyboard Arrow Support (Left / Right)
        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return;
            if (e.key === 'ArrowRight') nextSlide();
            if (e.key === 'ArrowLeft') prevSlide();
        });

        // ==========================================
        // EXERCISE INTERACTION HANDLERS
        // ==========================================
        function selectAnswer(slideIdx, qIdx, chosenOption) {
            if (!userAnswers[slideIdx]) {
                userAnswers[slideIdx] = {};
            }
            userAnswers[slideIdx][qIdx] = chosenOption;
            renderSlide(false); // Re-render without scroll jump
        }

        function resetSlideAnswers(slideIdx) {
            delete userAnswers[slideIdx];
            renderSlide(false);
        }

        // ==========================================
        // RENDERING ENGINE
        // ==========================================
        function renderSlide(animate = true) {
            const slide = slidesData[currentSlide];
            const container = document.getElementById('slideContainer');

            // Update header controls
            document.getElementById('slideSelector').value = currentSlide;
            document.getElementById('slideCounter').textContent = `${currentSlide + 1} / ${slidesData.length}`;
            document.getElementById('progressBar').style.width = `${((currentSlide + 1) / slidesData.length) * 100}%`;
            document.getElementById('prevBtn').disabled = currentSlide === 0;
            document.getElementById('nextBtn').disabled = currentSlide === slidesData.length - 1;

            // Update dots
            slidesData.forEach((_, idx) => {
                const dot = document.getElementById(`dot-${idx}`);
                if (dot) {
                    if (idx === currentSlide) {
                        dot.className = "w-6 h-2.5 rounded-full transition-all duration-200 bg-green-700";
                    } else {
                        dot.className = "w-2.5 h-2.5 rounded-full transition-all duration-200 bg-slate-300 hover:bg-green-500";
                    }
                }
            });

            if (animate) {
                container.classList.remove('slide-transition');
                void container.offsetWidth; // trigger reflow
                container.classList.add('slide-transition');
            }

            if (slide.type === 'intro') {
                container.innerHTML = renderIntroSlide();
            } else if (slide.type === 'core-modal') {
                container.innerHTML = renderCoreModalSlide(slide, currentSlide);
            } else if (slide.type === 'quiz-20') {
                container.innerHTML = renderLargeQuizSlide(slide, currentSlide, true);
            } else if (slide.type === 'equivalents') {
                container.innerHTML = renderEquivalentsSlide(slide, currentSlide);
            } else if (slide.type === 'quiz-equivalents') {
                container.innerHTML = renderLargeQuizSlide(slide, currentSlide, false);
            }
        }

        // 1. INTRO SLIDE TEMPLATE
